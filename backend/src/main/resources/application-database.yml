spring:
  autoconfigure:
    exclude: []
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:northwind_resolve}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

northwind:
  import:
    data-directory: ${NORTHWIND_IMPORT_DATA_DIRECTORY:../data}
